<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ديوان الأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surf:#FFFFFF; --surf2:#F8FAF9;
  --ink:#132220; --ink2:#455853; --muted:#7B8D88; --line:#DDE5E1;
  --brand:#0E6B5C;
  --accent:var(--brand); --accent-2:#0A5245; --accent-soft:color-mix(in srgb, var(--brand) 12%, #fff);
  --gold:#8A6210; --gold-soft:#F6EEDA;
  --danger:#AC352F; --danger-soft:#F8E6E4;
  --ok:#2C7550; --ok-soft:#E3F0E9;
  --warn:#9C6714; --warn-soft:#F7EEDE;
  --shadow:0 1px 2px rgba(19,34,32,.05), 0 10px 28px -18px rgba(19,34,32,.35);
  --r:12px;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surf:#15211E; --surf2:#1A2724;
    --ink:#E9F0ED; --ink2:#AFC0BA; --muted:#82938E; --line:#26332F;
    --accent:color-mix(in srgb, var(--brand) 62%, #EAF6F2); --accent-2:color-mix(in srgb, var(--brand) 40%, #EAF6F2);
    --accent-soft:color-mix(in srgb, var(--brand) 26%, #0D1614);
    --gold:#D9A94E; --gold-soft:#33280F;
    --danger:#E07A72; --danger-soft:#38201E;
    --ok:#6DC194; --ok-soft:#17301F;
    --warn:#D9A45B; --warn-soft:#332614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surf:#15211E; --surf2:#1A2724;
  --ink:#E9F0ED; --ink2:#AFC0BA; --muted:#82938E; --line:#26332F;
  --accent:color-mix(in srgb, var(--brand) 62%, #EAF6F2); --accent-2:color-mix(in srgb, var(--brand) 40%, #EAF6F2);
  --accent-soft:color-mix(in srgb, var(--brand) 26%, #0D1614);
  --gold:#D9A94E; --gold-soft:#33280F;
  --danger:#E07A72; --danger-soft:#38201E;
  --ok:#6DC194; --ok-soft:#17301F;
  --warn:#D9A45B; --warn-soft:#332614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(120% 90% at 80% 0%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 60%), var(--bg)}
.auth-card{width:min(440px,100%);background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px}
.auth-card .mark{width:46px;height:46px;font-size:18px;margin-bottom:16px}
.auth h1{font-size:22px;margin-bottom:4px}
.auth .lead{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.tabs{display:flex;gap:4px;background:var(--surf2);padding:4px;border-radius:10px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.auth .field{margin-bottom:14px}
.auth .err{background:var(--danger-soft);color:var(--danger);padding:9px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px}
.auth .foot{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.8}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--surf);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:14px;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-family:var(--f-disp);font-size:14.5px;font-weight:600;display:block;line-height:1.35}
.brand span{font-size:11.5px;color:var(--muted);display:block}
.navlabel{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:11px 10px 3px;font-weight:600}
.nav{background:none;border:0;text-align:start;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;width:100%}
.nav:hover{background:var(--surf2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav[aria-current="true"] .cnt{color:var(--accent)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.whoami{font-size:12px;color:var(--muted);padding:0 4px 6px;line-height:1.6}
.whoami b{color:var(--ink);font-size:13px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:22px 28px 0;flex-wrap:wrap}
.top h1{font-size:24px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .grow{flex:1}
.content{padding:20px 28px 48px;display:flex;flex-direction:column;gap:20px}
.ownerbar{background:var(--warn-soft);color:var(--warn);padding:8px 28px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}

/* ---------- controls ---------- */
.btn{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--ink);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surf2);border-color:var(--muted)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--surf);font-weight:500}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.gh:hover{background:var(--surf2);color:var(--ink)}
.btn.dg{color:var(--danger)}
.btn.wide{width:100%;justify-content:center}
.field input,.field select,.field textarea,.search input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:14px}
.field input[type=color]{padding:3px;height:40px}
.field textarea{min-height:74px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
.search{position:relative;min-width:min(280px,100%)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- surfaces ---------- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px}
.panel-h .grow{flex:1}
.panel-b{padding:18px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surf);padding:15px 18px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:3px}
.stat.acc .v{color:var(--accent)} .stat.dg .v{color:var(--danger)} .stat.gd .v{color:var(--gold)} .stat.ok .v{color:var(--ok)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surf2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surf2)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td .t2{color:var(--muted);font-size:12.5px}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact .btn{white-space:nowrap}
.who b{white-space:nowrap}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-disp);margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
.pill.np::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-dg{background:var(--danger-soft);color:var(--danger)}
.p-mut{background:var(--surf2);color:var(--muted);border:1px solid var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--surf2);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.av{width:30px;height:30px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.who{display:flex;align-items:center;gap:9px}

/* ---------- chart ---------- */
.chart{width:100%;height:230px;display:block;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .lab{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar-r{fill:var(--accent);transition:opacity .15s}
.chart g:hover .bar-r{opacity:.75}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .12s;white-space:nowrap}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surf);border-radius:14px;border:1px solid var(--line);width:min(660px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:1}
.modal-h h3{font-size:17px;flex:1}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surf)}
.toast{position:fixed;inset-block-end:22px;inset-inline-start:22px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;opacity:0;transform:translateY(8px);transition:.2s;max-width:min(380px,90vw)}
.toast.on{opacity:1;transform:none}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surf2);border:1px solid var(--line);padding:3px 8px;border-radius:7px;letter-spacing:.08em;direction:ltr;display:inline-block}

/* ---------- printable document ---------- */
#doc{background:#fff;color:#101c1a;width:100%;max-width:820px;margin:0 auto;padding:34px;border-radius:10px;font-size:14px}
#doc h2{font-size:22px;color:var(--dc,#0E6B5C)}
#doc .d-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--dc,#0E6B5C);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
#doc .d-brand{display:flex;gap:12px;align-items:flex-start}
#doc .d-logo{max-height:58px;max-width:130px;object-fit:contain}
#doc .d-meta{font-size:13px;color:#455853;line-height:1.9}
#doc table{font-size:13.5px}
#doc th{background:#f0f5f3;color:#455853;border-bottom:1px solid #d7e0dc}
#doc td{border-bottom:1px solid #e6ecea;color:#101c1a}
#doc .tot{display:flex;justify-content:flex-start;margin-top:18px}
#doc .tot table{width:min(360px,100%)}
#doc .tot td{border:0;padding:6px 4px}
#doc .tot .big{font-family:var(--f-disp);font-size:18px;font-weight:600;color:var(--dc,#0E6B5C)}
#doc .sign{display:flex;justify-content:space-between;margin-top:46px;gap:30px;font-size:13px;color:#455853}
#doc .sign div{border-top:1px dashed #9aa9a5;padding-top:7px;min-width:190px;text-align:center}
#doc .note{margin-top:16px;font-size:12.5px;color:#6b7a76}
.print-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}

@media print{
  body{background:#fff}
  .app,.auth,.toast,.tip,.ownerbar{display:none !important}
  .ov{position:static;background:none;padding:0;display:block;backdrop-filter:none}
  .modal{box-shadow:none;border:0;max-height:none;width:100%}
  .modal-h,.modal-f{display:none}
  .modal-b{padding:0}
  #doc{max-width:none;padding:0;border-radius:0}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-inline-start:0;border-bottom:1px solid var(--line);padding:12px}
  .brand{padding:0 8px 0 0}
  .navlabel{display:none}
  .side-foot{margin:0;border:0;padding:0;flex-direction:row}
  .whoami{display:none}
  .nav{width:auto;padding:7px 11px}
  .top,.content{padding-inline:16px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

</head>
<body>
<div id="auth" class="auth" hidden></div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="mark" id="brandMark">دأ</div>
      <div><b id="brandName">ديوان الأعمال</b><span id="brandSub">إدارة العملاء والمشاريع</span></div>
    </div>
    <div id="navBox"></div>
    <div class="side-foot">
      <div class="whoami" id="whoami"></div>
      <div class="row">
        <button class="btn sm gh" id="themeBtn">المظهر</button>
        <button class="btn sm gh" data-act="logout">خروج</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="ownerbar" id="ownerbar" hidden></div>
    <header class="top">
      <div>
        <h1 id="pageTitle">لوحة التحكم</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="grow"></div>
      <div id="pageActions" class="row"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-h"><h3 id="mTitle"></h3><button class="btn gh sm" data-close="1">إغلاق</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f" id="mFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

</script>
<script>
(function(){
"use strict";
const KEY="diwan.system.v2", OLD="diwan.business.v1";
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const num=n=>new Intl.NumberFormat("en-US",{maximumFractionDigits:2}).format(Number(n||0));
const MONTHS=["كانون٢","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","ت١","ت٢","كانون١"];
const MONTHS_L=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const fdate=d=>{if(!d)return"—";const x=new Date(d+"T00:00:00");if(isNaN(x))return d;return x.getDate()+" "+MONTHS[x.getMonth()]+" "+x.getFullYear();};
const fmonth=m=>{if(!m)return"—";const p=m.split("-");return (MONTHS_L[Number(p[1])-1]||"")+" "+p[0];};
const initials=n=>String(n||"؟").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("");
const genCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s.slice(0,4)+"-"+s.slice(4);};

/* ================= root store ================= */
let ROOT={v:2,owner:null,tenants:[],data:{},session:null};
let DB=null, ME=null, TENANT=null;
const blankData=()=>({clients:[],projects:[],logs:[],invoices:[],payments:[],team:[],pieces:[],payroll:[],
  settings:{company:"",owner:"",phone:"",address:"",currency:"د.ع",rate:0,demo:false}});

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(ROOT));}catch(e){toast("تعذر الحفظ محلياً — الذاكرة ممتلئة. صغّر الشعار أو خذ نسخة احتياطية.");}
  try{if(typeof queueSync==="function")queueSync();}catch(e){}
}
function loadRoot(){
  try{const raw=localStorage.getItem(KEY);if(raw){ROOT=JSON.parse(raw);}}catch(e){}
  if(!ROOT||typeof ROOT!=="object")ROOT={v:2,owner:null,tenants:[],data:{},session:null};
  ROOT.tenants=ROOT.tenants||[];ROOT.data=ROOT.data||{};
  // ترحيل بيانات النسخة الأولى
  try{
    const old=localStorage.getItem(OLD);
    if(old&&!ROOT.tenants.length){
      const o=JSON.parse(old);
      if(o&&Array.isArray(o.clients)){
        const t=newTenant(o.settings&&o.settings.company?o.settings.company:"مكتبي",""," ");
        const d=ROOT.data[t.id];
        d.clients=o.clients||[];d.projects=o.projects||[];d.logs=o.logs||[];d.invoices=o.invoices||[];d.payments=o.payments||[];
        d.settings=Object.assign(d.settings,o.settings||{});
        ROOT.migrated=true;
      }
    }
  }catch(e){}
}
function newTenant(name,email,code){
  const t={id:uid(),name:name||"جهة جديدة",color:"#0E6B5C",logo:"",active:true,createdAt:today(),notes:"",
    users:[{id:uid(),name:name||"المدير",email:(email||"").trim().toLowerCase(),code:(code||genCode()).trim().toUpperCase(),role:"مدير"}]};
  ROOT.tenants.push(t);ROOT.data[t.id]=blankData();ROOT.data[t.id].settings.company=t.name;
  return t;
}
function tenantOf(id){return ROOT.tenants.find(t=>t.id===id);}
function findLogin(idf,code){
  const e=(idf||"").trim().toLowerCase(), c=(code||"").trim().toUpperCase();
  for(const t of ROOT.tenants)for(const u of (t.users||[])){
    const okC=c&&u.code&&u.code.toUpperCase()===c;
    const okE=e&&u.email&&u.email.toLowerCase()===e;
    if(c&&e){if(okC&&okE)return{t,u};}
    else if(c&&okC)return{t,u};
    else if(e&&!c&&okE)return{t,u};
  }
  return null;
}
function activate(tid,userId){
  TENANT=tenantOf(tid);if(!TENANT)return false;
  DB=ROOT.data[tid]=Object.assign(blankData(),ROOT.data[tid]||{});
  DB.settings=Object.assign(blankData().settings,DB.settings||{});
  ME=(TENANT.users||[]).find(u=>u.id===userId)||{name:"المالك",role:"مدير",owner:true};
  applyBrand();return true;
}
function applyBrand(){
  const c=(TENANT&&TENANT.color)||"#0E6B5C";
  document.documentElement.style.setProperty("--brand",c);
}
const isOwnerSession=()=>ROOT.session&&ROOT.session.kind==="owner";
const role=()=>isOwnerSession()?"مدير":((ME&&ME.role)||"مشاهد");
const canEdit=()=>["مدير","محاسب"].includes(role());
const canAdmin=()=>role()==="مدير";
const money=n=>num(n)+" "+((DB&&DB.settings.currency)||"د.ع");

/* ================= derived ================= */
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id);
const clientName=id=>(byId(DB.clients,id)||{}).name||"—";
const projectTitle=id=>(byId(DB.projects,id)||{}).title||"—";
const memberName=id=>(byId(DB.team,id)||{}).name||"—";
const paidOf=invId=>DB.payments.filter(p=>p.invoiceId===invId).reduce((s,p)=>s+Number(p.amount||0),0);
function invStatus(inv){
  const paid=paidOf(inv.id),amt=Number(inv.amount||0);
  if(paid>=amt&&amt>0)return{k:"مسددة",cls:"p-ok",paid,rem:0};
  const late=inv.due&&inv.due<today();
  if(paid>0)return{k:late?"متأخرة — جزئياً":"مسددة جزئياً",cls:late?"p-dg":"p-warn",paid,rem:amt-paid};
  return{k:late?"متأخرة":"غير مسددة",cls:late?"p-dg":"p-mut",paid,rem:amt-paid};
}
const totals=()=>{
  const inv=DB.invoices.reduce((s,i)=>s+Number(i.amount||0),0);
  const paid=DB.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const late=DB.invoices.filter(i=>invStatus(i).rem>0&&i.due&&i.due<today()).reduce((s,i)=>s+invStatus(i).rem,0);
  return{inv,paid,due:inv-paid,late};
};
function nextNo(prefix,list){
  const y=new Date().getFullYear();
  const n=(list||[]).filter(x=>(x.no||"").includes("-"+y+"-")).length+1;
  return prefix+"-"+y+"-"+String(n).padStart(3,"0");
}
/* --- الفريق --- */
const PAYTYPES=["راتب شهري","بالقطعة","بالساعة"];
function memberPieces(id){return DB.pieces.filter(p=>p.memberId===id);}
function memberHours(id){return DB.logs.filter(l=>l.memberId===id);}
function memberCalc(m){
  const tx=DB.payroll.filter(x=>x.memberId===m.id);
  const sum=t=>tx.filter(x=>x.type===t).reduce((s,x)=>s+Number(x.amount||0),0);
  const salary=sum("راتب مستحق");
  const pieces=memberPieces(m.id).reduce((s,p)=>s+Number(p.qty||0)*Number(p.rate||0),0);
  const hoursH=memberHours(m.id).reduce((s,l)=>s+Number(l.hours||0),0);
  const hours=hoursH*Number(m.hourRate||0);
  const bonus=sum("مكافأة"), ded=sum("خصم"), pay=sum("دفعة"), adv=sum("سلفة");
  const earned=salary+pieces+hours+bonus;
  return{salary,pieces,hours,hoursH,bonus,ded,pay,adv,earned,due:earned-ded-pay-adv,paidOut:pay+adv};
}
function teamCostOfProject(pid){
  const pieces=DB.pieces.filter(p=>p.projectId===pid).reduce((s,p)=>s+Number(p.qty||0)*Number(p.rate||0),0);
  const hours=DB.logs.filter(l=>l.projectId===pid&&l.memberId).reduce((s,l)=>{
    const m=byId(DB.team,l.memberId);return s+Number(l.hours||0)*Number((m&&m.hourRate)||DB.settings.rate||0);},0);
  const sal=DB.payroll.filter(x=>x.projectId===pid&&["راتب مستحق","مكافأة"].includes(x.type)).reduce((s,x)=>s+Number(x.amount||0),0);
  return pieces+hours+sal;
}
const teamDueTotal=()=>DB.team.filter(m=>m.active!==false).reduce((s,m)=>s+memberCalc(m).due,0);

/* ================= ui helpers ================= */
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3000);}
function closeModal(){$("#ov").hidden=true;$("#mBody").innerHTML="";$("#mFoot").innerHTML="";}
function openModal(title,bodyHTML,footHTML){
  $("#mTitle").textContent=title;$("#mBody").innerHTML=bodyHTML;$("#mFoot").innerHTML=footHTML||"";$("#ov").hidden=false;
  const f=$("#mBody input,#mBody select,#mBody textarea");if(f)f.focus();
}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov"||e.target.dataset.close)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeModal();});
function askConfirm(msg,onYes){
  openModal("تأكيد","<p style='margin:0'>"+esc(msg)+"</p>",
    "<button class='btn p' id='yes'>نعم، تابع</button><button class='btn' data-close='1'>إلغاء</button>");
  $("#yes").onclick=()=>{closeModal();onYes();};
}
function fieldHTML(f,v){
  const val=v==null?"":v;let ctrl;
  if(f.type==="select")ctrl="<select name='"+f.name+"'>"+(f.opts||[]).map(o=>"<option value='"+esc(o.v)+"'"+(String(o.v)===String(val)?" selected":"")+">"+esc(o.t)+"</option>").join("")+"</select>";
  else if(f.type==="textarea")ctrl="<textarea name='"+f.name+"' placeholder='"+esc(f.ph||"")+"'>"+esc(val)+"</textarea>";
  else ctrl="<input name='"+f.name+"' type='"+(f.type||"text")+"' value='"+esc(val)+"' placeholder='"+esc(f.ph||"")+"'"+(f.type==="number"?" step='any' inputmode='decimal'":"")+">";
  return "<div class='field "+(f.span?"full":"")+"'><label>"+esc(f.label)+(f.req?" *":"")+"</label>"+ctrl+(f.hint?"<div class='hint'>"+esc(f.hint)+"</div>":"")+"</div>";
}
function openForm(title,fields,values,onSave){
  openModal(title,"<form id='frm' class='grid2'>"+fields.map(f=>fieldHTML(f,(values||{})[f.name])).join("")+"</form>",
    "<button class='btn p' id='sv'>حفظ</button><button class='btn' data-close='1'>إلغاء</button>");
  const submit=()=>{
    const frm=$("#frm"),out={};
    for(const f of fields){
      const el=frm.elements[f.name];let v=el?String(el.value).trim():"";
      if(f.req&&!v){toast("الحقل «"+f.label+"» مطلوب");if(el)el.focus();return;}
      out[f.name]=f.type==="number"?(v===""?0:Number(v)):v;
    }
    closeModal();onSave(out);
  };
  $("#sv").onclick=submit;$("#frm").onsubmit=e=>{e.preventDefault();submit();};
}

/* ================= printable documents ================= */
function docHead(title,meta){
  const s=DB.settings,logo=TENANT&&TENANT.logo;
  return "<div class='d-head'><div class='d-brand'>"+(logo?"<img class='d-logo' src='"+esc(logo)+"' alt=''>":"")+
    "<div><h2>"+esc(title)+"</h2><div class='d-meta'><b>"+esc(s.company||(TENANT&&TENANT.name)||"")+"</b>"+
    (s.owner?"<br>"+esc(s.owner):"")+(s.phone?"<br>هاتف: "+esc(s.phone):"")+(s.address?"<br>"+esc(s.address):"")+"</div></div></div>"+
    "<div class='d-meta' style='text-align:end'>"+meta+"</div></div>";
}
function showDoc(html,name){
  openModal(name,"<div class='print-wrap'><div id='doc' style='--dc:"+((TENANT&&TENANT.color)||"#0E6B5C")+"'>"+html+"</div></div>",
    "<button class='btn p' id='prt'>طباعة / حفظ PDF</button><button class='btn' data-close='1'>إغلاق</button>");
  $("#prt").onclick=()=>{try{window.print();}catch(e){toast("استخدم Ctrl+P للطباعة");}};
}
function invoiceDoc(inv){
  const st=invStatus(inv),pays=DB.payments.filter(p=>p.invoiceId===inv.id).sort((a,b)=>a.date<b.date?-1:1);
  let h=docHead("فاتورة","رقم الفاتورة: <b>"+esc(inv.no)+"</b><br>التاريخ: "+fdate(inv.date)+"<br>تاريخ الاستحقاق: "+fdate(inv.due));
  h+="<div class='d-meta' style='margin-bottom:14px'><b>السادة:</b> "+esc(clientName(inv.clientId))+"<br><b>المشروع:</b> "+esc(projectTitle(inv.projectId))+"</div>";
  h+="<table><thead><tr><th>البيان</th><th>ملاحظات</th><th style='text-align:end'>المبلغ</th></tr></thead><tbody><tr><td>"+
     esc(projectTitle(inv.projectId))+"</td><td>"+esc(inv.notes||"—")+"</td><td class='n' style='text-align:end'>"+money(inv.amount)+"</td></tr></tbody></table>";
  if(pays.length)h+="<div style='margin-top:16px'><b style='font-size:13px'>الدفعات المستلمة</b><table style='margin-top:6px'><thead><tr><th>رقم الوصل</th><th>التاريخ</th><th>الطريقة</th><th style='text-align:end'>المبلغ</th></tr></thead><tbody>"+
    pays.map(p=>"<tr><td>"+esc(p.no||"—")+"</td><td>"+fdate(p.date)+"</td><td>"+esc(p.method||"—")+"</td><td class='n' style='text-align:end'>"+money(p.amount)+"</td></tr>").join("")+"</tbody></table></div>";
  h+="<div class='tot'><table><tr><td>إجمالي الفاتورة</td><td class='n' style='text-align:end'>"+money(inv.amount)+"</td></tr>"+
     "<tr><td>المسدد</td><td class='n' style='text-align:end'>"+money(st.paid)+"</td></tr>"+
     "<tr><td class='big'>المتبقي</td><td class='n big' style='text-align:end'>"+money(st.rem)+"</td></tr></table></div>";
  h+="<div class='sign'><div>توقيع المستلم</div><div>ختم وتوقيع "+esc(DB.settings.company||(TENANT&&TENANT.name)||"")+"</div></div>";
  showDoc(h,"فاتورة "+inv.no);
}
function receiptDoc(p){
  const inv=byId(DB.invoices,p.invoiceId)||{};

function csv(rows){return "﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");}
let DL=null,dlTried=false;
async function saveVia(name,text,type){
  if(!dlTried){dlTried=true;try{if(window.claude&&typeof claude.use==="function")DL=await claude.use("downloads");}catch(e){DL=null;}}
  if(!DL)return false;
  try{await DL.save({filename:name,data:new Blob([text],{type:type||"text/plain;charset=utf-8"})});toast("تم حفظ الملف: "+name);}
  catch(err){if(!(err&&err.code==="declined"))toast("تعذر الحفظ — استخدم «عرض النسخة كنص»");}
  return true;
}
function download(name,text,type){saveVia(name,text,type).then(done=>{if(!done)downloadBlob(name,text,type);});}
function downloadBlob(name,text,type){
  try{
    const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
    toast("تم تجهيز الملف: "+name);
  }catch(e){toast("تعذر التنزيل — استخدم «عرض النسخة كنص»");}
}

    "<button class='btn p' id='cp'>نسخ النص</button><button class='btn' data-close='1'>إغلاق</button>");
  $("#cp").onclick=()=>{const t=$("#dump");t.select();try{navigator.clipboard.writeText(t.value);}catch(e){try{document.execCommand("copy");}catch(_){}}toast("تم النسخ");};
}
function pickImage(cb){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=320,sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cb(cv.toDataURL("image/png"));
      };
      img.onerror=()=>cb(r.result);
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
/* ================= chart ================= */
function monthlyChart(){
  const now=new Date(),buckets=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);buckets.push({k:d.toISOString().slice(0,7),lab:MONTHS[d.getMonth()],y:d.getFullYear(),v:0});}
  DB.payments.forEach(p=>{const b=buckets.find(x=>x.k===(p.date||"").slice(0,7));if(b)b.v+=Number(p.amount||0);});
  const max=Math.max(1,...buckets.map(b=>b.v));
  const W=760,H=210,padS=58,padE=8,padT=14,padB=26;
  const iw=W-padS-padE,ih=H-padT-padB,bw=Math.min(38,iw/buckets.length*0.62);
  const nice=Math.pow(10,Math.floor(Math.log10(max)));
  const top=Math.max(Math.ceil(max/nice)*nice,max);
  let g="";
  for(let i=0;i<=2;i++){
    const v=top/2*i,y=padT+ih-(v/top)*ih;
    g+="<line class='grid-l' x1='"+padE+"' x2='"+(W-padS)+"' y1='"+y+"' y2='"+y+"'></line>"+
       "<text class='lab' x='"+(W-padS+8)+"' y='"+(y+4)+"'>"+num(v)+"</text>";
  }
  let bars="";
  buckets.forEach((b,i)=>{
    const cx=(W-padS)-((i+0.5)*(iw/buckets.length));
    const h=b.v?Math.max(3,(b.v/top)*ih):0,x=cx-bw/2,y=padT+ih-h,r=Math.min(4,h);
    const path=h?("M"+x+" "+(padT+ih)+" V"+(y+r)+" Q"+x+" "+y+" "+(x+r)+" "+y+" H"+(x+bw-r)+" Q"+(x+bw)+" "+y+" "+(x+bw)+" "+(y+r)+" V"+(padT+ih)+" Z"):"";
    bars+="<g data-v='"+b.v+"' data-l='"+b.lab+" "+b.y+"'><rect x='"+x+"' y='"+padT+"' width='"+bw+"' height='"+ih+"' fill='transparent'></rect>"+
      (h?"<path class='bar-r' d='"+path+"'></path>":"")+"<text class='lab' x='"+cx+"' y='"+(H-8)+"' text-anchor='middle'>"+b.lab+"</text></g>";
  });
  return "<svg class='chart' viewBox='0 0 "+W+" "+H+"' preserveAspectRatio='xMidYMid meet' id='chart' role='img' aria-label='المقبوضات الشهرية لآخر ١٢ شهراً'>"+g+bars+"</svg>";
}
function bindChart(){
  const svg=$("#chart"),tip=$("#tip");if(!svg)return;
  svg.querySelectorAll("g").forEach(g=>{
    g.addEventListener("mousemove",e=>{tip.textContent=g.dataset.l+" — "+money(g.dataset.v);tip.style.opacity="1";tip.style.left=(e.clientX-tip.offsetWidth/2)+"px";tip.style.top=(e.clientY-38)+"px";});
    g.addEventListener("mouseleave",()=>{tip.style.opacity="0";});
  });
}

function progress(p){
  if(!p.start||!p.end)return 0;
  const a=new Date(p.start),b=new Date(p.end),n=new Date();
  if(n<=a)return 0;if(n>=b)return 100;
  return Math.round((n-a)/(b-a)*100);
}

function netStatusPill(){

async function netInit(){
  if(!netConfigured()||!window.supabase)return false;
  if(!NET.sb)NET.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});

  }catch(e){return true;}

async function rpc(fn,args){
  const {data,error}=await NET.sb.rpc(fn,args||{});
  if(error)throw error;
  return data;
}
async function netTenants(){
  const rows=await rpc("my_tenants");
  NET.list=(rows||[]).map(r=>({id:r.id,name:r.name,color:r.color||"#0E6B5C",logo:r.logo||"",active:r.active,role:r.role||"مشاهد",users:[]}));
  return NET.list;
}
/* ---- pull / push ---- */
async function netPull(tid){
  NET.status="جارٍ المزامنة";paintStatus();
  const {data,error}=await NET.sb.from("records").select("id,kind,data,deleted").eq("tenant_id",tid);
  if(error)throw error;
  const d=blankData();
  (data||[]).forEach(r=>{
    if(r.deleted)return;
    if(r.kind==="settings"){d.settings=Object.assign(d.settings,r.data||{});return;}
    if(KINDS.includes(r.kind))d[r.kind].push(Object.assign({id:r.id},r.data||{}));
  });
  ROOT.data[tid]=d;DB=d;
  NET.status="متصل";paintStatus();
  return d;
}
function rowsOf(tid){
  const rows=[];
  KINDS.forEach(k=>(DB[k]||[]).forEach(o=>{
    const data=Object.assign({},o);delete data.id;
    rows.push({id:o.id,tenant_id:tid,kind:k,data,deleted:false});
  }));
  rows.push({id:"main",tenant_id:tid,kind:"settings",data:DB.settings||{},deleted:false});
  return rows;
}
async function netPush(){
  if(!NET.sb||!NET.user||!TENANT||!DB)return;
  if(NET.busy){NET.dirty=true;return;}
  NET.busy=true;NET.status="جارٍ المزامنة";paintStatus();
  try{
    const tid=TENANT.id,rows=rowsOf(tid);
    const {error}=await NET.sb.from("records").upsert(rows,{onConflict:"tenant_id,kind,id"});
    if(error)throw error;
    const {data:server}=await NET.sb.from("records").select("id,kind").eq("tenant_id",tid);
    const keep=new Set(rows.map(r=>r.kind+"|"+r.id));
    const gone=(server||[]).filter(r=>!keep.has(r.kind+"|"+r.id));
    for(const g of gone)await NET.sb.from("records").delete().eq("tenant_id",tid).eq("kind",g.kind).eq("id",g.id);
    await NET.sb.from("tenants").update({name:TENANT.name,color:TENANT.color,logo:TENANT.logo||"",notes:TENANT.notes||""}).eq("id",tid);
    NET.status="متصل";
  }catch(e){NET.status="بانتظار الاتصال";}
  NET.busy=false;paintStatus();
  if(NET.dirty){NET.dirty=false;setTimeout(netPush,600);}
}
function queueSync(){
  if(!NET.sb||!NET.user||!TENANT)return;
  clearTimeout(NET.timer);NET.timer=setTimeout(netPush,900);
}
function paintStatus(){
  const el=document.getElementById("netPill");
  if(el)el.outerHTML="<span id='netPill'>"+netStatusPill()+"</span>";
}

function netAuthScreen(err,mode){
  const m=mode||netAuthScreen.mode||"in";netAuthScreen.mode=m;
  showAuth("<div class='mark'>دأ</div><h1>ديوان الأعمال</h1><div class='lead'>نظام إدارة الأعمال — دخول بحسابك على الخادم.</div>"+
    "<div class='tabs'><button data-m='in' aria-selected='"+(m==="in")+"'>تسجيل الدخول</button>"+
    "<button data-m='up' aria-selected='"+(m==="up")+"'>حساب جديد</button></div>"+
    (err?"<div class='err'>"+esc(err)+"</div>":"")+
    (m==="up"?"<div class='field'><label>الاسم</label><input id='aName'></div>":"")+
    "<div class='field'><label>البريد الإلكتروني</label><input id='aEmail' type='email' autocomplete='email'></div>"+
    "<div class='field'><label>كلمة المرور</label><input id='aPass' type='password' autocomplete='"+(m==="up"?"new-password":"current-password")+"'></div>"+
    (m==="up"?"<div class='field'><label>كود الدعوة (إن وُجد)</label><input id='aCode' placeholder='XXXX-XXXX' style='direction:ltr;text-align:left'></div>":"")+
    "<button class='btn p wide' id='aGo'>"+(m==="up"?"إنشاء الحساب":"دخول")+"</button>"+
    "<div class='foot'>بياناتك محفوظة على خادمك الخاص. كل جهة ترى بياناتها فقط.</div>");
  $("#auth").querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>netAuthScreen("",b.dataset.m));
  const go=async()=>{
    const email=$("#aEmail").value.trim().toLowerCase(),pass=$("#aPass").value;
    if(!email||!pass){netAuthScreen("أدخل البريد وكلمة المرور",m);return;}
    $("#aGo").textContent="لحظة…";
    try{
      if(m==="up"){
        const name=$("#aName").value.trim(),code=$("#aCode").value.trim();
        const {data,error}=await NET.sb.auth.signUp({email,password:pass,options:{data:{name}}});
        if(error)throw error;
        if(!data.session){netAuthScreen("أنشئ الحساب. افتح بريدك وفعّل الحساب ثم سجّل الدخول.","in");return;}
        NET.user=data.user;
        if(code){try{await rpc("redeem_invite",{p_code:code});}catch(e){toast("تعذر تفعيل الكود: "+(e.message||""));}}
      }else{
        const {data,error}=await NET.sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        NET.user=data.user;
      }
      NET.owner=!!(await rpc("is_owner"));
      netBoot();
    }catch(e){netAuthScreen(errText(e),m);}
  };
  $("#aGo").onclick=go;
  $("#auth").querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go();});
}
function errText(e){
  const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m))return "البريد أو كلمة المرور غير صحيحة";
  if(/already registered/i.test(m))return "هذا البريد مسجّل مسبقاً — سجّل الدخول";
  if(/Email not confirmed/i.test(m))return "فعّل الحساب من رسالة البريد أولاً";
  if(/Password should be/i.test(m))return "كلمة المرور قصيرة — 6 أحرف فأكثر";
  return m||"حدث خطأ";
}

async function netEnter(tid){
  const t=NET.list.find(x=>x.id===tid);if(!t){netChoose("الحساب غير متاح");return;}
  if(t.active===false&&!NET.owner){netChoose("هذا الحساب موقوف — راجع مالك النظام");return;}
  TENANT=Object.assign(tenantOf(tid)||{},t);
  if(!ROOT.tenants.some(x=>x.id===tid))ROOT.tenants.push(TENANT);
  ROOT.session={kind:NET.owner?"owner":"user",tenantId:tid,userId:NET.user.id,net:true};
  ME={id:NET.user.id,name:(NET.user.user_metadata&&NET.user.user_metadata.name)||NET.user.email,role:t.role,email:NET.user.email};
  try{await netPull(tid);}catch(e){toast("تعذر جلب البيانات — سيُعرض آخر ما لديك");DB=ROOT.data[tid]||blankData();}
  applyBrand();save();
  state.page="dash";$("#auth").hidden=true;$("#app").hidden=false;render();
}
async function netBoot(){
  if(!NET.user){netAuthScreen();return;}
  try{await netTenants();}catch(e){}
  const s=ROOT.session;
  if(s&&s.net&&s.tenantId&&NET.list.some(t=>t.id===s.tenantId)){netEnter(s.tenantId);return;}
  if(s&&s.net&&NET.owner&&!s.tenantId){TENANT=null;DB=null;ME=null;state.page="accounts";
    document.documentElement.style.setProperty("--brand","#0E6B5C");$("#auth").hidden=true;$("#app").hidden=false;render();return;}
  if(NET.list.length===1&&!NET.owner){netEnter(NET.list[0].id);return;}
  netChoose();
}

function restoreUI(all){
  openModal(all?"استعادة نسخة النظام":"استعادة نسخة الحساب",
    "<div class='field'><label>ملف النسخة (json)</label><input type='file' id='fl' accept='.json,application/json'></div>"+
    "<div class='field' style='margin-top:14px'><label>أو الصق نص النسخة</label><textarea id='tx' style='min-height:160px;direction:ltr;text-align:left;font-family:monospace;font-size:12px'></textarea></div>",
    "<button class='btn p' id='rs'>استعادة</button><button class='btn' data-close='1'>إلغاء</button>");
  const apply=txt=>{
    try{
      const d=JSON.parse(txt);
      if(all){
        if(!d||!Array.isArray(d.tenants))throw 0;
        ROOT=d;ROOT.session={kind:"owner",tenantId:null};save();closeModal();boot();toast("تمت استعادة النظام");
      }else{
        const data=d.data||d;
        if(!data||!Array.isArray(data.clients))throw 0;
        ROOT.data[TENANT.id]=Object.assign(blankData(),data);
        if(d.tenant&&d.tenant.name){TENANT.color=d.tenant.color||TENANT.color;TENANT.logo=d.tenant.logo||TENANT.logo;}
        save();activate(TENANT.id,ME&&ME.id);closeModal();render();toast("تمت الاستعادة");
      }
    }catch(err){toast("الملف غير صالح");}
  };
  $("#fl").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f);};
  $("#rs").onclick=()=>{const v=$("#tx").value.trim();if(v)apply(v);else toast("الصق النص أو اختر ملفاً");};
}

/* ================= boot ================= */
async function boot(){
  if(netConfigured()){
    const ok=await netInit();
    if(ok&&NET.sb){netBoot();return;}
  }
  if(!ROOT.owner){setupScreen();return;}
  if(!ROOT.tenants.length&&!ROOT.seeded){
    const t=newTenant("مكتب الديوان (نموذج)","demo@example.com",genCode());
    seedTenant(t);ROOT.seeded=true;save();
  }
  const s=ROOT.session;
  if(!s){loginScreen();return;}
  if(s.kind==="owner"){
    if(s.tenantId&&tenantOf(s.tenantId)){activate(s.tenantId,null);if(!PAGES[state.page]||["accounts","ownerset"].includes(state.page))state.page="dash";}
    else{DB=null;TENANT=null;ME=null;document.documentElement.style.setProperty("--brand","#0E6B5C");
      if(!["accounts","ownerset"].includes(state.page))state.page="accounts";}
  }else{
    if(!activate(s.tenantId,s.userId)){ROOT.session=null;save();loginScreen();return;}
    if(["accounts","ownerset"].includes(state.page))state.page="dash";
  }
  $("#auth").hidden=true;$("#app").hidden=false;
  render();
}
loadRoot();boot();
})();
</script>
